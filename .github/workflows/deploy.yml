on:
  workflow_call:

# deploy-pages publishes the artifact (pages:write) and proves the deployment
# came from this workflow via OIDC (id-token:write)
permissions:
  pages: write
  id-token: write

# a Pages deploy goes straight to production, so an in-flight one is left to
# finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
